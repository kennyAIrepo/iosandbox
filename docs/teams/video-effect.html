<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopeOS HoloHands — Teams video effect</title>
<!--
  video-effect.html — the page Teams loads at manifest.meetingExtensionDefinition.videoFiltersConfigurationUrl.

  WHERE IT RUNS. Teams hosts it in the meeting SIDE PANEL frame context; every videoEffects call in the SDK is
  guarded with ensureInitialized(runtime, FrameContexts.sidePanel) (packages/teams-js/src/public/videoEffects.ts
  L225, L262, L279 on main, fetched 2026-09-18). The page shows the effect thumbnails and, invisibly to the user,
  processes every outgoing camera frame.

  SDK. @microsoft/teams-js 2.56.0 (npm "latest", published 2026-09-02T23:10Z) loaded as the UMD build from
  Microsoft's CDN (global `microsoftTeams`). Verified 2026-09-18: HEAD
  https://res.cdn.office.net/teams-js/2.56.0/js/MicrosoftTeams.min.js -> HTTP 200, Content-Length 212471.
  With a bundler instead: `npm i @microsoft/teams-js` then `import { app, videoEffects } from '@microsoft/teams-js'`.

  THE THREE CALLS (names verbatim from videoEffects.ts):
    videoEffects.registerForVideoEffect(cb)                     host -> app "apply effect <id>"       (L278-293)
    videoEffects.registerForVideoFrame({videoFrameHandler,
                                        videoBufferHandler,
                                        config})                host -> app frames, BOTH handlers    (L224-248)
    videoEffects.notifySelectedVideoEffectChanged(type, id)     app -> host "user picked a tile"      (L258-271)

  WIRE MESSAGES the SDK exchanges with the host for those calls (postMessage `func` names, from the source):
    app->host 'video.registerForVideoEffect'                 host->app 'video.effectParameterChange' [effectId]
    app->host 'video.mediaStream.registerForVideoFrame'      host->app 'video.startVideoExtensibilityVideoStream' {streamId}
    app->host 'video.registerForVideoFrame' (sharedFrame)    host->app 'video.newVideoFrame' {width,height,videoFrameBuffer,...}
    app->host 'video.videoFrameProcessed' [timestamp]        host->app 'video.setFrameProcessTimeLimit' {timeLimit}
    app->host 'video.videoEffectChanged' [type, id]          app->host 'video.videoEffectReadiness' [ok, id, reason]
    app->host 'video.notifyError' [message]                  app->host 'video.performance.*' telemetry

  LOCAL TESTING. Open host-harness.html (same folder). Mode A calls effect-core.js directly; Mode B loads THIS
  page in an iframe with ?harness=1 and speaks the real postMessage protocol to the real SDK.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: #1f1f1f; color: #e8e8e8; }
  header { padding: 12px 14px 6px; font-weight: 600; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 8px 14px; }
  .tile { border: 2px solid transparent; border-radius: 8px; background: #2b2b2b; cursor: pointer; text-align: center; padding: 6px; }
  .tile:hover { background: #333; }
  .tile.selected { border-color: #7f85f5; }
  .tile .thumb { height: 56px; border-radius: 6px; background: linear-gradient(135deg, #2f3f7a, #1a1f3a); margin-bottom: 4px; }
  .tile[data-id="none"] .thumb { background: #444; }
  .hud { margin: 10px 14px; padding: 8px 10px; background: #141414; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre; }
  .warn { color: #ffb86b; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<header>hopeOS HoloHands</header>
<!-- data-id values MUST equal manifest.json meetingExtensionDefinition.videoFilters[].id -->
<div class="grid" id="tiles">
  <div class="tile selected" data-id="none"><div class="thumb"></div>None</div>
  <div class="tile" data-id="2a4f6c8e-1b3d-4e5f-8a9b-0c1d2e3f4a5b"><div class="thumb"></div>HoloHands</div>
  <div class="tile" data-id="9f8e7d6c-5b4a-4c3d-9e2f-1a0b9c8d7e6f"><div class="thumb"></div>Ball pass</div>
  <div class="tile" data-id="c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f"><div class="thumb"></div>Apple in hand</div>
</div>
<div class="hud" id="hud">booting…</div>
<!-- Mode B fallback preview (only used when the processed track cannot be relayed to the parent). -->
<video id="localPreview" autoplay muted playsinline hidden style="width:100%"></video>

<!-- Real SDK, UMD build. Must be loaded before the module below. Pin the version; never use "latest". -->
<script src="https://res.cdn.office.net/teams-js/2.56.0/js/MicrosoftTeams.min.js"></script>

<script type="module">
import { createEffect, EFFECT_IDS } from './effect-core.js';

const { app, videoEffects } = window.microsoftTeams;
const hud = document.getElementById('hud');
const log = (s, cls = '') => { hud.innerHTML = (cls ? `<span class="${cls}">${s}</span>` : s) + '\n' + hud.innerHTML.split('\n').slice(0, 14).join('\n'); };

const params = new URLSearchParams(location.search);
const HARNESS = params.get('harness') === '1';

// ------------------------------------------------------------------ Mode B shim (harness only)
// The SDK takes the mediaStream path only if BOTH window.chrome.webview.getTextureStream and
// window.chrome.webview.registerTextureStream exist AND runtime.supports.video.mediaStream is set
// (videoEffects.ts doesSupportMediaStream L437-443, isTextureStreamAvailable L445-449). In real Teams those two
// functions are WebView2's experimental TextureStream JavaScript bindings (ICoreWebView2ExperimentalTextureStream,
// prerelease SDK 1.0.1724+, origin-gated by AddAllowedOrigin). Here we fake them with getUserMedia.
if (HARNESS) {
  window.chrome = window.chrome || {};
  window.chrome.webview = {
    async getTextureStream(streamId) {
      log(`shim getTextureStream(${streamId}) -> getUserMedia`);
      const w = +params.get('w') || 1280, h = +params.get('h') || 720;
      return navigator.mediaDevices.getUserMedia({ video: { width: w, height: h }, audio: false });
    },
    registerTextureStream(streamId, generatorTrack) {
      // generatorTrack is the SDK's MediaStreamTrackGenerator (videoEffectsUtils.ts L145-154), a MediaStreamTrack.
      // It is NOT transferable via postMessage (DataCloneError in Chrome 152), but WebCodecs VideoFrames are, so
      // relay each processed frame to the parent tile. If relaying fails, preview inside this panel.
      try {
        const proc = new MediaStreamTrackProcessor({ track: generatorTrack });
        proc.readable.pipeTo(new WritableStream({
          write(frame) { parent.postMessage({ __harness: 'frame', streamId, frame }, location.origin, [frame]); },
        })).catch((e) => log(`relay ended: ${e}`, 'warn'));
        parent.postMessage({ __harness: 'frameRelay', streamId }, location.origin);
        log(`shim registerTextureStream(${streamId}) -> relaying VideoFrames to parent`);
      } catch (e) {
        const v = document.getElementById('localPreview');
        v.hidden = false; v.srcObject = new MediaStream([generatorTrack]);
        parent.postMessage({ __harness: 'processedTrackLocal', streamId, reason: String(e) }, location.origin);
        log(`shim registerTextureStream: local preview (${e.name})`, 'warn');
      }
    },
  };
}

// ------------------------------------------------------------------ MediaPipe tracker stub
// Names verified against @mediapipe/tasks-vision vision.d.ts on jsDelivr (2026-09-18), both 0.10.18 (the version
// hopeOS pins in sdk/) and 1.0.1 (npm latest):
//   FilesetResolver.forVisionTasks(basePath?, useModule?)                       (1.0.1 L792)
//   HandLandmarker.createFromOptions(wasmFileset, handLandmarkerOptions)      (1.0.1 L952)
//   HandLandmarker.detectForVideo(videoFrame: ImageSource, timestamp, opts?)  (1.0.1 L1008; 0.10.18 L1120)
//   type ImageSource = TexImageSource                                          (1.0.1 L1823; 0.10.18 L1935)
// TexImageSource in TypeScript's lib.dom includes VideoFrame, so a WebCodecs frame can be fed directly.
// Keep whichever version hopeOS's HoloHands rig was tuned on. Self-host wasm + .task on the validDomains origin.
const MP_VERSION = '0.10.18';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
async function createHandTracker() {
  // TODO(hopeOS): enable once the .task model URL is pinned and hosted on a validDomains origin.
  // const { FilesetResolver, HandLandmarker } = await import(`${MP_BASE}/vision_bundle.mjs`);
  // const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  // return HandLandmarker.createFromOptions(fileset, {
  //   baseOptions: { modelAssetPath: 'https://h0p3.io/models/hand_landmarker.task', delegate: 'GPU' },
  //   runningMode: 'VIDEO', numHands: 2,
  // });
  return null; // null = debug overlay only (no inference)
}

// ------------------------------------------------------------------ effect pipeline
// effect-core.js owns the two frame handlers and the canvas render. Replace `render` with the hopeOS HoloHands
// three.js overlay (renderer.render into an OffscreenCanvas with alpha, then drawImage onto the frame canvas).
const effect = createEffect({ createTracker: createHandTracker /*, render: hopeOSRender */ });

function selectTile(id) {
  for (const t of document.querySelectorAll('.tile')) t.classList.toggle('selected', t.dataset.id === (id ?? 'none'));
}

// ------------------------------------------------------------------ SDK wiring
try {
  // app.initialize(validMessageOrigins?: string[]) (public/app/app.ts L688). In the harness the parent is
  // http://localhost:*; origins passed here are exempt from the https-only rule
  // (internal/validOrigins.ts L136 "User provided additional valid origins take precedence as they do not require
  // https protocol"). In real Teams call app.initialize() with no arguments.
  await app.initialize(HARNESS ? [location.origin] : undefined);
  const ctx = await app.getContext().catch(() => null);
  log(`initialized; frameContext=${ctx?.page?.frameContext} host=${ctx?.app?.host?.clientType}`);

  if (!videoEffects.isSupported()) {
    // isSupported() = runtime.supports.video && (video.mediaStream || video.sharedFrame) (videoEffects.ts L329-336).
    log('videoEffects.isSupported() === false on this host', 'err');
    throw new Error('video capability not supported');
  }

  // 1) Host -> app: "apply this effect". Pre-meeting: immediately after we notify. In-meeting: on the Apply click
  //    (videoEffects.ts L252-253). effectId === undefined means EffectDisabled.
  videoEffects.registerForVideoEffect(async (effectId) => {
    log(`effectParameterChange -> ${effectId ?? '(disabled)'}`);
    await effect.onEffectChanged(effectId);   // throws 'InvalidEffectId' | 'InitializationFailure' on failure
    selectTile(effectId);
  });

  // 2) Host -> app: frames. The host picks ONE of the two handlers based on runtime.supports.video.*;
  //    the SDK throws if either is missing (L229-231).
  videoEffects.registerForVideoFrame({
    // mediaStream hosts (new Teams / WebView2): ({ videoFrame }) => Promise<VideoFrame>. Return a NEW frame; the SDK
    // closes both the input and the returned frame after re-wrapping it with the original timestamp.
    videoFrameHandler: async (videoFrameData) => effect.videoFrameHandler(videoFrameData),
    // sharedFrame hosts (classic/Electron Teams, the sample test app): edit the NV12 Uint8ClampedArray IN PLACE, then
    // call notifyVideoFrameProcessed(); call notifyError(msg) on failure.
    videoBufferHandler: (bufferData, notifyVideoFrameProcessed, notifyError) =>
      effect.videoBufferHandler(bufferData, notifyVideoFrameProcessed, notifyError),
    // Only NV12 exists in the public enum (VideoFrameFormat L70-73). (The Learn example writes
    // `videoEffects.VideoPixelFormat.NV12`; that identifier does not exist in the source — use VideoFrameFormat.)
    config: { format: videoEffects.VideoFrameFormat.NV12 },
  });
  log('registerForVideoFrame OK (waiting for host stream)');

  // 3) App -> host: user picked a thumbnail. EffectChangeType = 'EffectChanged' | 'EffectDisabled' (L90-99).
  document.getElementById('tiles').addEventListener('click', (e) => {
    const tile = e.target.closest('.tile'); if (!tile) return;
    const id = tile.dataset.id === 'none' ? undefined : tile.dataset.id;
    if (id === effect.effectId) return;
    videoEffects.notifySelectedVideoEffectChanged(
      id ? videoEffects.EffectChangeType.EffectChanged : videoEffects.EffectChangeType.EffectDisabled,
      id,
    );
    log(`notifySelectedVideoEffectChanged(${id ? 'EffectChanged' : 'EffectDisabled'}, ${id ?? 'undefined'})`);
  });

  app.notifySuccess();   // public/app/app.ts L812
} catch (e) {
  log(`init failed: ${e.message || e}`, 'err');
  // Outside Teams (and outside the harness) the SDK rejects with "Initialization Failed. No Parent window found."
}

// Per-second stats line (handler time is what the host's 100 ms limit / 22 fps rule measures).
setInterval(() => {
  const s = effect.stats;
  if (s.frames) log(`${s.mode} frames=${s.frames} last=${s.lastMs.toFixed(1)}ms avg=${s.avgMs.toFixed(1)}ms max=${s.maxMs.toFixed(1)}ms`);
}, 1000);
</script>
</body>
</html>
