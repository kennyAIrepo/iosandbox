{ const q = new URLSearchParams(location.search).get('server');

// st-8: OPTIONAL generative-effect lane — a second socket, fully additive.

{ const q = new URLSearchParams(location.search).get('fx');
  if (q) localStorage.setItem('hopeos-fx-server', q); }
const FX_LANE = localStorage.getItem('hopeos-fx-server') || '';

{ const q = new URLSearchParams(location.search).get('rig');
  if (q) localStorage.setItem('hopeos-rig-server', q); }
const _rl = localStorage.getItem('hopeos-rig-server');
const RIG_LANE = _rl === 'off' ? ''
  : (_rl || 'wss://kennyairepo--hopeos-rig-rig-web.modal.run/ws');   // st-20 default

// camera) rendering the same person's rig live from the cloud hub.
// st-27: garment relaunch — shirt starts ON once (new freeze-safe layer)
if (!localStorage.getItem('hopeos-shirt-v3')) {
  localStorage.setItem('hopeos-shirt', '1'); localStorage.setItem('hopeos-shirt-v3', '1');
}
const ROOM = new URLSearchParams(location.search).get('room') || '';
const ROLE = new URLSearchParams(location.search).get('role') === 'dollhouse' ? 'dollhouse' : 'cam';
const RIG_URL = RIG_LANE && ROOM
  ? RIG_LANE + (RIG_LANE.includes('?') ? '&' : '?') + 'room=' + encodeURIComponent(ROOM)
    + '&role=' + (ROLE === 'dollhouse' ? 'view' : 'cam')
  : RIG_LANE;

const vid = document.getElementById('vid'), lov = document.getElementById('lov');
const lctx = lov.getContext('2d');
const statEl = document.getElementById('stat');
let toastT = 0;
function toast(m, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, ms);
}

// ── state ────────────────────────────────────────────────────────────────
const S = { ws: null, inFlight: 0, lastSend: 0, sendIv: 90, rtt: 0, rttEma: 0, baseRtt: 9999,
  players: [], smasks: [], court: null, samMs: 0, msGpu: 0, lastPkt: 0,
  rig: { topo: null, lastPkt: 0, ms: 0 }, concepts: new Set(), sam: false,
  rigOn: true };   // DEFAULT ON — the dollhouse tracks your body rig from the first frame

// ── view toggle ──────────────────────────────────────────────────────────
document.querySelectorAll('.vbtn[data-v]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.vbtn[data-v]').forEach(x => x.classList.toggle('sel', x === b));
  document.getElementById('screens').className = b.dataset.v === 'split' ? '' : b.dataset.v;
  sizeDH();
}));

// ── DOLLHOUSE (right): orbitable live reconstruction ─────────────────────
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('dh'), antialias: true, alpha: true });
const scn = new THREE.Scene();
scn.background = new THREE.Color(0x0a0f16);
const cam = new THREE.PerspectiveCamera(46, 1, 0.05, 200);
cam.position.set(0.4, 0.7, 3.2);
const orbit = new OrbitControls(cam, ren.domElement);
// st-37 TOUCH: one finger orbits · PINCH zooms in/out · two-finger drag pans.
// Damping makes pinch/orbit glide naturally; distance clamps keep the scene
// from being lost by over-zooming.
orbit.enableZoom = true;
orbit.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
orbit.minDistance = 0.6;
orbit.maxDistance = 60;
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;
// st-21: dollhouse gizmo (translate/rotate/scale the rig) + mirror toggle
const tc = new TransformControls(cam, ren.domElement);
tc.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; });
scn.add(tc);
let tcMode = 0;
function dhBtn(txt, right, fn) {
  const b = document.createElement('button');
  b.textContent = txt;
  b.style.cssText = 'position:absolute;top:30px;right:' + right +
    'px;z-index:9;background:#0c1622cc;color:#9fc0dd;border:1px solid #274058;' +
    'border-radius:6px;padding:4px 9px;cursor:pointer;font:11px monospace';
  b.onclick = fn;
  document.getElementById('scrR').appendChild(b);
  return b;
}
addEventListener('DOMContentLoaded', () => {
  dhBtn('🪞 mirror', 8, () => { if (!rigMesh) return;
    rigMesh.scale.x *= -1;
    const mir = rigMesh.scale.x < 0;
    localStorage.setItem('hopeos-dh-mirror', mir ? '1' : '0');
    if (rigMesh.material.uniforms.uMirr) rigMesh.material.uniforms.uMirr.value = mir ? 1 : 0; });
  // st-23 CLOSET — one item for now: the yellow hackathon tee
  dhBtn('👕 closet: yellow tee', 184, () => {
    SHIRT2.on = !SHIRT2.on;                       // st-27: garment layer, rig untouched
    if (SHIRT2.on) {                              // st-38: toggle = intentional re-tailor
      try { for (const k of Object.keys(localStorage))
        if (k.startsWith('hopeos-fit')) localStorage.removeItem(k); } catch {}
      if (SHIRT2.host) { if (SHIRT2.mesh) SHIRT2.host.remove(SHIRT2.mesh);
                         if (PANTS.mesh) SHIRT2.host.remove(PANTS.mesh); }
      SHIRT2.mesh = null; PANTS.mesh = null;
    }
    localStorage.setItem('hopeos-shirt', SHIRT2.on ? '1' : '0');
    toast(SHIRT2.on ? '👕 wearing: A Real Quantum Hackathon tee (stand arms-down for the best fit)'
                    : '👕 shirt off'); });
  const gz = dhBtn('🎛 gizmo', 96, () => { if (!rigMesh) return;
    tcMode = (tcMode + 1) % 4;
    if (tcMode === 0) { tc.detach(); gz.textContent = '🎛 gizmo'; }
    else { const m = ['translate', 'rotate', 'scale'][tcMode - 1];
           tc.attach(rigMesh); tc.setMode(m); gz.textContent = '🎛 ' + m; } });
});
orbit.target.set(0, 0, 0); orbit.enableDamping = true;
scn.add(new THREE.HemisphereLight(0xbfe8ff, 0x0a1220, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(3, 6, 4); scn.add(sun);
const grid = new THREE.GridHelper(8, 32, 0x2e4a6e, 0x16233a); grid.position.y = -1.05; scn.add(grid);

const SCALE_FRAG = `
  precision highp float;
  varying vec3 vPos; varying vec3 vNrm; varying vec3 vONrm;
  uniform sampler2D uTex, uNrm;
  uniform sampler2D uDecal;                     // st-23: chest-print (closet)
  uniform float uTime, uGrow, uScale, uShirt, uMirr;
  uniform vec3 uBMin, uBMax, uShirtCol;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
  }
  float fbm(vec2 p){ return 0.55*noise(p) + 0.28*noise(p*2.03) + 0.17*noise(p*4.11); }
  vec3 triplanar(sampler2D s, vec3 pos, vec3 n, float sc){
    vec3 b = pow(abs(n), vec3(4.0)); b /= max(dot(b, vec3(1.0)), 1e-4);
    return texture2D(s, pos.yz*sc).rgb*b.x + texture2D(s, pos.xz*sc).rgb*b.y + texture2D(s, pos.xy*sc).rgb*b.z;
  }
  void main() {
    vec3 n = normalize(vNrm);
    vec3 alb = triplanar(uTex, vPos, n, uScale);
    vec3 nt  = triplanar(uNrm, vPos, n, uScale) * 2.0 - 1.0;
    vec3 nn  = normalize(n + nt * 0.85);
    float lam = clamp(dot(nn, normalize(vec3(0.4, 0.8, 0.5))), 0.0, 1.0);
    vec3 col = alb * (0.42 + 0.85 * lam) + pow(lam, 20.0) * 0.3;
    float warp  = (fbm(vPos.xy * 9.0 + uTime * 0.05) - 0.5) * 0.16;
    float front = 1.15 - uGrow * 2.45 + warp;
    float on = smoothstep(front - 0.02, front + 0.14, vPos.y);
    col += smoothstep(0.06, 0.0, abs(vPos.y - front)) * (0.4 + 0.4 * sin(uTime * 7.0)) * vec3(0.25, 0.7, 0.3);
    // st-40: avatar base = skin tone (sampled from the reference swatch)
    vec3 grey = vec3(0.937, 0.682, 0.518) * (0.30 + 0.70 * clamp(dot(n, normalize(vec3(0.4,0.8,0.5))), 0.0, 1.0));
    vec3 outc = mix(grey, col, on);

    // ── st-23 CLOSET: yellow tee over the upper torso + short sleeves ──────
    // Region is cut in NORMALIZED body space (0=head-top .. 1=feet, y-down
    // camera convention), so it fits any person and any framing.
    if (uShirt > 0.5) {
      vec3 bs = max(uBMax - uBMin, vec3(1e-4));
      float nx = (vPos.x - uBMin.x) / bs.x;
      float ny = (vPos.y - uBMin.y) / bs.y;
      float torso   = step(0.14, ny) * step(ny, 0.50) * step(abs(nx - 0.5), 0.24);
      float sleeves = step(0.14, ny) * step(ny, 0.30);
      float neck    = step(ny, 0.175) * step(abs(nx - 0.5), 0.085);
      float shirt = clamp(torso + sleeves, 0.0, 1.0) * (1.0 - neck);
      if (shirt > 0.0) {
        // soft cotton: real yellow from the photo, wrinkle noise, low sheen
        float wr = fbm(vPos.xy * 16.0 + vPos.z * 6.0) - 0.5;
        vec3 cloth = uShirtCol * (0.60 + 0.45 * lam + wr * 0.10);
        cloth += pow(lam, 8.0) * 0.05;
        // chest print — wearer's LEFT upper chest, front faces only
        vec2 duv = vec2((nx - 0.635) / 0.17 + 0.5, (ny - 0.235) / 0.19 + 0.5);
        if (duv.x > 0.0 && duv.x < 1.0 && duv.y > 0.0 && duv.y < 1.0 && vONrm.z < -0.05) {
          duv.x = mix(duv.x, 1.0 - duv.x, uMirr);   // st-24: stay readable under mirror
          float ink = texture2D(uDecal, duv).a;
          cloth = mix(cloth, vec3(0.06, 0.06, 0.07), ink * 0.92);
        }
        outc = mix(outc, cloth, shirt);
      }
    }
    gl_FragColor = vec4(outc, 1.0);
  }`;
// st-22: the dollhouse mesh INTERPOLATES between rig packets in the vertex
// shader (aPrev→position over uMix), exactly the LIVE_EFFECTS_PLAN contract —
// "client interpolates to 60" — instead of snapping at packet rate.
const SCALE_VERT = `
  attribute vec3 aPrev; attribute vec3 aPrevN;
  uniform float uMix;
  varying vec3 vPos; varying vec3 vNrm; varying vec3 vONrm;
  void main() {
    vec3 p = mix(aPrev, position, uMix);
    vPos = p; vNrm = normalMatrix * normalize(mix(aPrevN, normal, uMix));
    vONrm = normalize(mix(aPrevN, normal, uMix));   // object-space (st-23: shirt front)
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;
// LEFT-SCREEN EFFECT LAYER — the same mesh projected ONTO the live person
// (pinhole projection in the vertex shader via cam_t/focal, exactly the
// mpgames cs-19 technique): the effect lives on YOUR BODY in the live view,
// while the dollhouse shows it in orbitable 3D.
const LFX_VERT = `
  attribute vec3 aPrev;
  uniform float uMix;
  uniform vec3 uCamT; uniform float uFocal, uIw, uIh;
  uniform vec4 uCover; uniform vec2 uCanvas;
  uniform vec2 uShift;                          // E1: pose-rate snap (live bbox − rig-time bbox)
  varying vec3 vPos; varying vec2 vUV;
  void main() {
    vec3 v = mix(aPrev, position, uMix);        // lerp between 2.5Hz refreshes
    vPos = v;
    vec3 p = v + uCamT;
    float sx = (uFocal * p.x / p.z + uIw * 0.5) / uIw + uShift.x;
    float sy = (uFocal * p.y / p.z + uIh * 0.5) / uIh + uShift.y;
    vUV = vec2(sx, 1.0 - sy);                   // where THIS surface point sits in the video
    vec2 px = vec2(uCover.x + sx * uCover.z, uCover.y + sy * uCover.w);
    vec2 ndc = vec2(px.x / uCanvas.x * 2.0 - 1.0, -(px.y / uCanvas.y * 2.0 - 1.0));
    gl_Position = vec4(ndc, clamp(p.z / 80.0, 0.0, 0.95), 1.0);
  }`;
// PROJECTIVE TEXTURING — the indistinguishable trick: the mesh's base color is
// the LIVE VIDEO sampled at each fragment's own projected position, i.e. the
// user's real pixels. The effect then MODULATES that skin (green-shift, rim,
// relief) instead of painting over it — misalignment shows nearly-identical
// neighboring skin pixels, not a wrong color, so it reads as real.
// PHOTOREAL MATERIAL SHADER — the user's own pixels, re-lit as scales.
//  · TRIPLANAR mapping of the AI-generated tileable texture onto the BODY MESH
//    in its own object space, so the material sticks to anatomy (no screen-door
//    sliding) and never stretches on sideways-facing surfaces.
//  · OVERLAY blend: skin luminance is preserved and the scale albedo modulates
//    it — your arm's real lighting/shadow/form survives, which is what sells it.
//  · NORMAL MAP (Sobel-derived on the node) perturbs a light term for real
//    relief, so scales catch highlights.
//  · ORGANIC GROWTH: the boundary is fbm-noise warped, not a straight sweep,
//    and passes through a partial "tinted skin" zone before full scales —
//    that gradient is the skin→scale transition of the reference photo.
const LFX_FRAG = `
  precision highp float;
  varying vec3 vPos; varying vec2 vUV;
  uniform sampler2D uVid;
  uniform sampler2D uMask;                      // E1: feathered person-mask clip
  uniform sampler2D uTex;                       // AI albedo (tileable)
  uniform sampler2D uNrm;                       // derived normal map
  uniform float uTime, uGrow, uHasTex, uScale;

  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
               mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
  }
  float fbm(vec2 p){ return 0.55*noise(p) + 0.28*noise(p*2.03) + 0.17*noise(p*4.11); }

  vec3 triplanar(sampler2D s, vec3 pos, vec3 n, float sc){
    vec3 b = pow(abs(n), vec3(4.0));
    b /= max(dot(b, vec3(1.0)), 1e-4);
    return texture2D(s, pos.yz * sc).rgb * b.x
         + texture2D(s, pos.xz * sc).rgb * b.y
         + texture2D(s, pos.xy * sc).rgb * b.z;
  }
  vec3 overlay(vec3 base, vec3 top){
    return mix(2.0 * base * top, 1.0 - 2.0 * (1.0 - base) * (1.0 - top), step(0.5, base));
  }

  void main() {
    if (vUV.x < 0.002 || vUV.x > 0.998 || vUV.y < 0.002 || vUV.y > 0.998) discard;
    vec3 n = normalize(cross(dFdx(vPos), dFdy(vPos)));
    vec3 skin = texture2D(uVid, vUV).rgb;
    float mclip = smoothstep(0.15, 0.6, texture2D(uMask, vUV).r);

    // ---- material -------------------------------------------------------
    vec3 alb = triplanar(uTex, vPos, n, uScale);
    vec3 nt  = triplanar(uNrm, vPos, n, uScale) * 2.0 - 1.0;   // tangent-ish
    vec3 nn  = normalize(n + nt * 0.85);                        // perturbed
    float lam  = clamp(dot(nn, normalize(vec3(0.25, -0.35, -1.0))), 0.0, 1.0);
    float spec = pow(lam, 22.0);

    // keep the PERSON's luminance, take the MATERIAL's color+detail
    float skinLum = dot(skin, vec3(0.299, 0.587, 0.114));
    vec3 mat = overlay(skin, alb);
    mat = mix(mat, mat * (0.55 + 0.85 * lam), 0.75);            // relief shading
    mat += spec * 0.35;                                          // wet highlight

    const t = performance.now();
    RIGWS.lastPkt = t; RIGWS.ms = d.ms || RIGWS.ms;
    RIGWS.lastSend = 0;   // ping-pong: a finished inference invites a fresh frame NOW
    // st-22: cts is our capture stamp echoed back → TRUE camera→mesh latency
    if (d.cts && t - d.cts > 0 && t - d.cts < 10000) {
      RIGWS.e2e = RIGWS.e2e ? RIGWS.e2e * .8 + (t - d.cts) * .2 : t - d.cts; }
    if (d.rig_topo && d.rig_topo.faces !== S.rig.topoFaces) rigTopo(d.rig_topo);
    if (d.rig) rigPacket(d.rig);
    if (d.rigst === 'loading' && !S._mlt) { S._mlt = 1; toast('⚡ Modal rig GPU warming up…', 6000); }
  };
}
rigLaneConnect();
// ── st-22: DEDICATED RIG PUMP ────────────────────────────────────────────
// The rig lane used to piggyback on the node pump: frames went out only when
// the node lane's adaptive cadence fired (tuned by OREGON's rtt), gated by
// the NODE's in-flight counter, and not at all while the node socket was
// down. Now the rig lane captures + paces its own frames: the Modal server
// is latest-frame-wins, so we offer frames at ~2× the measured packet rate —
// the frame it picks up is never older than ~half an inference.
const rcv = document.createElement('canvas'); const rctx = rcv.getContext('2d');
RIGWS.lastSend = 0; RIGWS.busy = false; RIGWS.e2e = 0;
function rigPump(now) {
  if (!RIGWS.up || !S.rigOn || RIGWS.busy || !vid.videoWidth) return;
  if (RIGWS.ws.readyState !== 1 || RIGWS.ws.bufferedAmount > 131072) return;
  const iv = Math.max(80, Math.min(300, (S.rig.span || 400) * 0.5));
  if (now - RIGWS.lastSend < iv) return;
  RIGWS.lastSend = now; RIGWS.busy = true;
  // 768px is plenty: the model crops the person box and resizes to its own
  // input — smaller jpeg = faster encode + upload + decode
  const w = 768, h = Math.round(w * vid.videoHeight / vid.videoWidth) || 432;
  rcv.width = w; rcv.height = h; rctx.drawImage(vid, 0, 0, w, h);
  const capT = now;
  rcv.toBlob(b => {
    RIGWS.busy = false;
    if (!b || !RIGWS.up || RIGWS.ws.readyState !== 1) return;
    b.arrayBuffer().then(buf => {
      const out = new ArrayBuffer(8 + buf.byteLength);
      new DataView(out).setFloat64(0, capT, true);
      new Uint8Array(out, 8).set(new Uint8Array(buf));
      RIGWS.ws.send(out);
    });
  }, 'image/jpeg', 0.6);
}
function pump(now) {
  if (!S.ws || S.ws.readyState !== 1 || !vid.videoWidth) return;
  const over = S.rttEma - S.baseRtt;
  S.sendIv = Math.min(280, Math.max(66, S.sendIv * (over > 140 ? 1.2 : over < 70 ? .94 : 1)));
  if (now - S.lastSend >= 1500) S.inFlight = 0;
  if (S.inFlight >= 2 || S.ws.bufferedAmount > 131072 || now - S.lastSend < S.sendIv) return;
  S.inFlight++; S.lastSend = now;
  const w = 960, h = Math.round(w * vid.videoHeight / vid.videoWidth) || 540;
  cv.width = w; cv.height = h; cctx.drawImage(vid, 0, 0, w, h);
  const capT = now;
  cv.toBlob(b => {
    if (!b || !S.ws || S.ws.readyState !== 1) { S.inFlight = Math.max(0, S.inFlight - 1); return; }
    b.arrayBuffer().then(buf => {
      const out = new ArrayBuffer(8 + buf.byteLength);
      new DataView(out).setFloat64(0, capT, true);
      new Uint8Array(out, 8).set(new Uint8Array(buf));
      S.ws.send(out);
      // (st-22) rig lane no longer piggybacks here — rigPump() owns its cadence
    });
  }, 'image/jpeg', 0.62);
}

// ── FX LANE (st-8): generative effect server — parallel, additive ────────
// OUT binary: [f64 LE capture-ms][JPEG of the person crop] at ≤8fps.
// OUT text:   {"cmd":"fx",on,prompt,strength} · {"cmd":"mask",png} every ~1s.
// IN:         {"fx":{cts,jpg,ms}} → #lfx2 at the crop rect · {"fxst":"loading"}.
const lfx2 = document.getElementById('lfx2'); const fx2Ctx = lfx2.getContext('2d');
const fxCv = document.createElement('canvas'); const fxCtx = fxCv.getContext('2d');
const FX = { ws: null, on: false, prompt: '', lastSend: 0, lastMask: 0, ms: 0,
  lastFrame: 0, frame: null, shown: false, crops: new Map() };
function fxConnect() {
  if (!FX_LANE) return;
  try { FX.ws = new WebSocket(FX_LANE); } catch { return; }
  FX.ws.binaryType = 'arraybuffer';
  FX.ws.onopen = () => {       // reconnect mid-effect → re-arm the server
    if (FX.on) FX.ws.send(JSON.stringify({ cmd: 'fx', on: 1, prompt: FX.prompt, strength: 0.45 }));
  };
  FX.ws.onclose = () => setTimeout(fxConnect, 2000);
  FX.ws.onmessage = (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.fxst === 'loading' && !FX._lt) { FX._lt = 1; toast('🎨 generative effect model loading on the GPU…', 8000); }
    if (d.fx && d.fx.jpg) fxFrame(d.fx);
  };
}
function fxTarget() {          // rig target if set, else biggest bbox
  let p = S.rig.id != null ? S.players.find(q => q.id === S.rig.id) : null;
  if (!p) for (const q of S.players) if (!p || q.bbox.w * q.bbox.h > p.bbox.w * p.bbox.h) p = q;
  return p;
}
function fxPump(now) {
  if (!FX.ws || FX.ws.readyState !== 1 || !FX.on) return;
  if (now - FX.lastMask > 1000) {          // ~1s: ship the feathered person mask
    FX.lastMask = now;
    try { FX.ws.send(JSON.stringify({ cmd: 'mask', png: maskCv.toDataURL('image/png').split(',')[1] })); } catch {}
  }
  if (!vid.videoWidth || now - FX.lastSend < 125 || FX.ws.bufferedAmount > 262144) return;
  const p = fxTarget(); if (!p) return;
  const vw = vid.videoWidth, vh = vid.videoHeight;
  let w = p.bbox.w * 1.15, h = p.bbox.h * 1.15;                   // expand 15%
  let x = p.bbox.x + (p.bbox.w - w) / 2, y = p.bbox.y + (p.bbox.h - h) / 2;
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(1 - x, w); h = Math.min(1 - y, h);                 // clamp to frame
  const pw = Math.round(w * vw), ph = Math.round(h * vh);
  if (pw < 16 || ph < 16) return;
  const scl = Math.min(1, 512 / Math.max(pw, ph));                // long side ≤ 512
  FX.lastSend = now;
  fxCv.width = Math.max(2, Math.round(pw * scl)); fxCv.height = Math.max(2, Math.round(ph * scl));
  fxCtx.drawImage(vid, x * vw, y * vh, pw, ph, 0, 0, fxCv.width, fxCv.height);
  const capT = now;
  FX.crops.set(capT, { x, y, w, h });                             // cts → crop rect
  for (const k of FX.crops.keys()) if (capT - k > 5000) FX.crops.delete(k);
  fxCv.toBlob(b => {
    if (!b || !FX.ws || FX.ws.readyState !== 1) return;
    b.arrayBuffer().then(buf => {
      const out = new ArrayBuffer(8 + buf.byteLength);
      new DataView(out).setFloat64(0, capT, true);
      new Uint8Array(out, 8).set(new Uint8Array(buf));
      FX.ws.send(out);
    });
  }, 'image/jpeg', 0.7);
}
function fxFrame(f) {
  let rect = FX.crops.get(f.cts);
  if (!rect) {                 // float64 cts didn't round-trip bit-exact → nearest
    let bd = 34;
    for (const [k, v] of FX.crops) { const dd = Math.abs(k - f.cts); if (dd < bd) { bd = dd; rect = v; } }
  }
  if (!rect) return;
  const img = new Image();
  img.onload = () => {
    FX.frame = { img, rect }; FX.ms = f.ms || 0; FX.lastFrame = performance.now();
    if (!FX.shown) { FX.shown = true; lfx2.style.opacity = '1'; }  // CSS fades in 300ms
  };
  img.src = 'data:image/jpeg;base64,' + f.jpg;
}
function drawFx2() {
  const r = document.getElementById('scrL').getBoundingClientRect();
  if (lfx2.width !== Math.round(r.width)) { lfx2.width = Math.round(r.width); lfx2.height = Math.round(r.height); }
  fx2Ctx.clearRect(0, 0, lfx2.width, lfx2.height);
  if (!FX.on || !FX.frame || performance.now() - FX.lastFrame > 2500) return;
  // cover-projection of the source frame into the screen rect (same as drawLive)
  const vw = vid.videoWidth || 960, vh = vid.videoHeight || 540;
  const sc = Math.max(lfx2.width / vw, lfx2.height / vh);
  const dw = vw * sc, dh2 = vh * sc, ox = (lfx2.width - dw) / 2, oy = (lfx2.height - dh2) / 2;
  const { img, rect } = FX.frame;
  fx2Ctx.drawImage(img, ox + rect.x * dw, oy + rect.y * dh2, rect.w * dw, rect.h * dh2);
}
function fxOn(prompt) {
  FX.on = true; FX.prompt = prompt;
  if (FX.ws?.readyState === 1) FX.ws.send(JSON.stringify({ cmd: 'fx', on: 1, prompt, strength: 0.45 }));
}
function fxOff() {
  FX.on = false; FX.frame = null; FX.shown = false; lfx2.style.opacity = '0';
  if (FX.ws?.readyState === 1) FX.ws.send(JSON.stringify({ cmd: 'fx', on: 0 }));
}

// ── the PROMPT — primary input, routes intent to the lanes ───────────────
function applyPrompt(raw) {
  const p = raw.trim().toLowerCase();
  if (!p) return;
  const say = (m) => toast(m, 4000);
  if (/^(clear|reset|stop|off|✕ clear all)/.test(p) || p.includes('clear all')) {
    for (const c of S.concepts) S.ws?.send(JSON.stringify({ cmd: 'concept', text: c, on: 0 }));
    S.concepts.clear(); S.sam = false;
    S.ws?.send(JSON.stringify({ cmd: 'sam', on: 0 }));
    grow0 = 0;                       // effects off — the body rig itself STAYS (default state)
    pxOff();                         // st-14: own-pixels layer off
    if (FX_LANE) fxOff();            // st-8: also stop the generative lane
    say('✕ effects & concepts cleared — body rig keeps tracking (that is the default)'); return;
  }
  // material switch: "snake skin" / "dragon scales" / "fish" / "lizard"
  { const m = p.match(/\b(snake|dragon|fish|lizard)\b/);
    if (m && MATTEX.name !== m[1]) matSwap(m[1]); }
  if (/(scale|slime|skin|dragon|feather|armor|fire|snake|lizard|fish)/.test(p)) {
    // st-14: the live wrap is the OWN-PIXELS rig — client-side, no SAM crop.
    // The cloud rig stays only for the dollhouse (right screen).
    S.rigOn = true;
    if (!RIGWS.up) S.ws?.send(JSON.stringify({ cmd: 'rig', on: 1 }));
    grow0 = performance.now();       // start the growth front NOW
    pxOn();
    if (FX_LANE) fxOn(raw.trim());
    say('🐉 growing onto your hands & forearms — real 3D mesh, your own pixels'); return;
  }
  if (/(segment|people|everyone|mask)/.test(p)) {
    S.sam = true; S.ws?.send(JSON.stringify({ cmd: 'sam', on: 1 }));
    say('🎭 segmenting everyone — masks appear as SAM3 finds them'); return;
  }
  // anything else = a CONCEPT to find & track ("track the floor" → floor)
  const text = p.replace(/^(track|find|add|show|segment)\s+(the\s+)?/, '').trim();
  if (!text) return;
  S.concepts.add(text); S.sam = true;
  S.ws?.send(JSON.stringify({ cmd: 'sam', on: 1 }));
  S.ws?.send(JSON.stringify({ cmd: 'concept', text, on: 1 }));
  say(`🧿 tracking "${text}" — mask + label appear as SAM3 locks on`);
}
document.getElementById('pgo').addEventListener('click', () => {
  const i = document.getElementById('pin'); applyPrompt(i.value); i.value = '';
});
document.getElementById('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('pgo').click(); });
document.getElementById('chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (c) applyPrompt(c.textContent.replace(/^[^\s]+\s/, ''));
});

// ── boot ─────────────────────────────────────────────────────────────────
async function boot(kind) {
  document.getElementById('boot').style.display = 'none';
  if (kind === 'cam') {
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      vid.srcObject = st;
    } catch (e) { toast('camera blocked: ' + e.message, 6000); return; }
  } else {
    document.body.classList.add('nomirror');       // footage shows unmirrored
    vid.crossOrigin = 'anonymous'; vid.src = SAMPLE_URL; vid.loop = true;
  }
  await vid.play().catch(() => {});
  connect();
  fxConnect();                                   // no-op when FX_LANE is empty
}
document.getElementById('bootCam').addEventListener('click', () => boot('cam'));
document.getElementById('bootSample').addEventListener('click', () => boot('sample'));
// st-22: remote-viewer boot — no camera, no upload; full-screen dollhouse fed
// by the room's rig packets from the hub
if (ROLE === 'dollhouse') {
  document.getElementById('boot').style.display = 'none';
  document.getElementById('scrL').style.display = 'none';
  const R = document.getElementById('scrR');
  R.style.position = 'fixed'; R.style.inset = '0';
  S.rigOn = true;
  toast('🏠 REMOTE DOLLHOUSE — room "' + (ROOM || 'solo') + '" · rendering the producer\'s live rig', 7000);
}

// ── main loop ────────────────────────────────────────────────────────────
function loop(now) {
  requestAnimationFrame(loop);
  pump(now);
  rigPump(now);   // st-22: rig lane pumps itself — independent of the node lane
  fxPump(now);
  drawLive();
  drawLfx(now);
  pxDraw(now);    // st-14 own-pixels hand rig — client-side, zero-latency wrap
  shirt2Tick();   // st-27 garment layer — dresses the rig without touching it
  drawFx2();
  orbit.update();
  if (rigMesh) {
    rigMesh.material.uniforms.uTime.value = now * .001;
    rigMesh.material.uniforms.uGrow.value = grow0 ? Math.min(1, (now - grow0) / 5000) : 0;
    // st-22: blend aPrev→target over the measured packet interval → smooth
    // 60fps motion between rig refreshes instead of packet-rate snapping
    rigMesh.material.uniforms.uMix.value =
      S.rig.lastPkt ? Math.min(1, (now - S.rig.lastPkt) / rigSpan()) : 1;
  }
  sizeDH.once || (sizeDH(), sizeDH.once = 1);
  ren.render(scn, cam);
  statEl.textContent = (S.ws?.readyState === 1 ? '●' : '○') +
    ` ${BUILD} · rtt ${S.rtt.toFixed(0)}ms · gpu ${S.msGpu.toFixed(0)}ms` +
    (S.samMs ? ` · sam ${S.samMs.toFixed(0)}ms` : '') +
    (S.rig.lastPkt ? ` · rig ${S.rig.ms.toFixed(0)}ms` +
      (RIGWS.e2e ? `/${RIGWS.e2e.toFixed(0)}e2e` : '') : '') + (PX.ready ? ` · hand ${PX.ms.toFixed(1)}ms` : '') +
    ` · ${S.players.length}p` +
    (FX.lastFrame && now - FX.lastFrame < 3000 ? ` · fx ${FX.ms.toFixed(0)}ms` : '');
}
requestAnimationFrame(loop);
</script>
