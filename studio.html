<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BUILD = 'st-7';
const SAMPLE_URL = 'https://speeches-restaurant-laugh-capability.trycloudflare.com/nba_sample.mp4';
// STUDIO owns its own server key + defaults to the SAM3 lane — deliberately
// NOT shared with mpgames' key, whose saved value may point at the SAM2.1
// lane (no concepts, no rig) and silently gut this page.
const SAM3_LANE = 'wss://dubai-intelligence-micro-grad.trycloudflare.com';
{ const q = new URLSearchParams(location.search).get('server');
  if (q) localStorage.setItem('hopeos-studio-server', q); }
const SRV = localStorage.getItem('hopeos-studio-server') || SAM3_LANE;

const vid = document.getElementById('vid'), lov = document.getElementById('lov');
const lctx = lov.getContext('2d');
const statEl = document.getElementById('stat');
let toastT = 0;
function toast(m, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, ms);
}

// ── state ────────────────────────────────────────────────────────────────
const S = { ws: null, inFlight: 0, lastSend: 0, sendIv: 90, rtt: 0, rttEma: 0, baseRtt: 9999,
  players: [], smasks: [], court: null, samMs: 0, msGpu: 0, lastPkt: 0,
  rig: { topo: null, lastPkt: 0, ms: 0 }, concepts: new Set(), sam: false,
  rigOn: true };   // DEFAULT ON — the dollhouse tracks your body rig from the first frame

// ── view toggle ──────────────────────────────────────────────────────────
document.querySelectorAll('.vbtn[data-v]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.vbtn[data-v]').forEach(x => x.classList.toggle('sel', x === b));
  document.getElementById('screens').className = b.dataset.v === 'split' ? '' : b.dataset.v;
  sizeDH();
}));

// ── DOLLHOUSE (right): orbitable live reconstruction ─────────────────────
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('dh'), antialias: true, alpha: true });
const scn = new THREE.Scene();
scn.background = new THREE.Color(0x0a0f16);
const cam = new THREE.PerspectiveCamera(46, 1, 0.05, 200);
cam.position.set(0.4, 0.7, 3.2);
const orbit = new OrbitControls(cam, ren.domElement);
orbit.target.set(0, 0, 0); orbit.enableDamping = true;
scn.add(new THREE.HemisphereLight(0xbfe8ff, 0x0a1220, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(3, 6, 4); scn.add(sun);
const grid = new THREE.GridHelper(8, 32, 0x2e4a6e, 0x16233a); grid.position.y = -1.05; scn.add(grid);

const SCALE_FRAG = `
  precision highp float;
  varying vec3 vPos; varying vec3 vNrm;
  uniform float uTime, uGrow;
  void main() {
    vec3 n = normalize(vNrm);
    vec2 g = vec2(vPos.x, vPos.y) * 28.0; g.y *= 1.62;
    vec2 id = floor(g); g.x += mod(id.y, 2.0) * 0.5;
    vec2 f = fract(g) - vec2(0.5, 0.0);
    float r = length(f);
    float tile = smoothstep(0.55, 0.47, r);
    float rim = smoothstep(0.50, 0.44, r) - smoothstep(0.42, 0.34, r);
    float lam = clamp(dot(n, normalize(vec3(0.4, 0.8, 0.5))), 0.0, 1.0);
    vec3 base = mix(vec3(0.03, 0.15, 0.07), vec3(0.14, 0.55, 0.23), lam);
    vec3 col = base + rim * vec3(0.55, 0.85, 0.6) * (0.35 + 0.65 * lam) + pow(lam, 8.0) * 0.22;
    float front = 1.1 - uGrow * 2.4;
    float on = smoothstep(front - 0.02, front + 0.12, vPos.y);
    col += smoothstep(0.1, 0.0, abs(vPos.y - front)) * (0.5 + 0.5 * sin(uTime * 9.0)) * vec3(0.4, 1.0, 0.5);
    vec3 grey = vec3(0.55) * (0.25 + 0.75 * lam);
    gl_FragColor = vec4(mix(grey, col, on), 1.0);
  }`;
const SCALE_VERT = `
  varying vec3 vPos; varying vec3 vNrm;
  void main() {
    vPos = position; vNrm = normalMatrix * normal;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
// LEFT-SCREEN EFFECT LAYER — the same mesh projected ONTO the live person
// (pinhole projection in the vertex shader via cam_t/focal, exactly the
// mpgames cs-19 technique): the effect lives on YOUR BODY in the live view,
// while the dollhouse shows it in orbitable 3D.
const LFX_VERT = `
  attribute vec3 aPrev;
  uniform float uMix;
  uniform vec3 uCamT; uniform float uFocal, uIw, uIh;
  uniform vec4 uCover; uniform vec2 uCanvas;
  uniform vec2 uShift;                          // E1: pose-rate snap (live bbox − rig-time bbox)
  varying vec3 vPos; varying vec2 vUV;
  void main() {
    vec3 v = mix(aPrev, position, uMix);        // lerp between 2.5Hz refreshes
    vPos = v;
    vec3 p = v + uCamT;
    float sx = (uFocal * p.x / p.z + uIw * 0.5) / uIw + uShift.x;
    float sy = (uFocal * p.y / p.z + uIh * 0.5) / uIh + uShift.y;
    vUV = vec2(sx, 1.0 - sy);                   // where THIS surface point sits in the video
    vec2 px = vec2(uCover.x + sx * uCover.z, uCover.y + sy * uCover.w);
    vec2 ndc = vec2(px.x / uCanvas.x * 2.0 - 1.0, -(px.y / uCanvas.y * 2.0 - 1.0));
    gl_Position = vec4(ndc, clamp(p.z / 80.0, 0.0, 0.95), 1.0);
  }`;
// PROJECTIVE TEXTURING — the indistinguishable trick: the mesh's base color is
// the LIVE VIDEO sampled at each fragment's own projected position, i.e. the
// user's real pixels. The effect then MODULATES that skin (green-shift, rim,
// relief) instead of painting over it — misalignment shows nearly-identical
// neighboring skin pixels, not a wrong color, so it reads as real.
const LFX_FRAG = `
  precision highp float;
  varying vec3 vPos; varying vec2 vUV;
  uniform sampler2D uVid;
  uniform sampler2D uMask;                      // E1: feathered person-mask clip
  uniform float uTime, uGrow;
  void main() {
    // never sample outside the video frame (was: clamped black triangles)
    if (vUV.x < 0.002 || vUV.x > 0.998 || vUV.y < 0.002 || vUV.y > 0.998) discard;
    vec3 n = normalize(cross(dFdx(vPos), dFdy(vPos)));
    vec3 skin = texture2D(uVid, vUV).rgb;
    // pixel-accurate silhouette adherence: the SAM mask clips the 3D mesh with
    // a soft feather — scales can never spill onto the background or a hand
    float mclip = smoothstep(0.15, 0.6, texture2D(uMask, vUV).r);
    vec2 g = vec2(vPos.x, vPos.y) * 28.0; g.y *= 1.62;
    vec2 id = floor(g); g.x += mod(id.y, 2.0) * 0.5;
    vec2 f = fract(g) - vec2(0.5, 0.0);
    float r = length(f);
    float tile = smoothstep(0.55, 0.47, r);
    float rim = smoothstep(0.50, 0.44, r) - smoothstep(0.42, 0.34, r);
    float lam = clamp(dot(n, normalize(vec3(0.25, -0.35, -1.0))), 0.0, 1.0);
    // the scales are the user's own skin, green-shifted + shaded — not paint
    vec3 scaled = skin * vec3(0.52, 1.08, 0.58);
    scaled *= 0.72 + 0.55 * lam;
    scaled += rim * vec3(0.30, 0.55, 0.33) * (0.4 + 0.6 * lam);
    scaled += pow(lam, 8.0) * 0.14;
    float front = 1.1 - uGrow * 2.4;
    float on = smoothstep(front - 0.02, front + 0.12, vPos.y);
    vec3 col = mix(skin, scaled, 0.30 + 0.70 * tile);
    col += smoothstep(0.10, 0.0, abs(vPos.y - front)) * (0.5 + 0.5 * sin(uTime * 9.0 + vPos.x * 40.0)) * vec3(0.35, 0.9, 0.45);
    float alpha = on * 0.96 * mclip;
    if (alpha < 0.01) discard;
    gl_FragColor = vec4(col, alpha);
  }`;
let rigMesh = null, lfxMesh = null, lfxRen = null, lfxScn = null, lfxCam = null, grow0 = 0;
// E1: feathered person-mask → texture that clips the effect mesh
const maskCv = document.createElement('canvas'); maskCv.width = 480; maskCv.height = 270;
const maskCtx = maskCv.getContext('2d');
let maskTex = null;
function b64u16(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return new Uint16Array(a.buffer); }
function rigTopo(t) {
  const mk = () => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(t.nv * 3), 3));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(b64u16(t.faces)), 1));
    return geo;
  };
  const mat = new THREE.ShaderMaterial({ vertexShader: SCALE_VERT, fragmentShader: SCALE_FRAG,
    uniforms: { uTime: { value: 0 }, uGrow: { value: 0 } }, side: THREE.DoubleSide });
  rigMesh = new THREE.Mesh(mk(), mat);
  rigMesh.frustumCulled = false;
  rigMesh.rotation.x = Math.PI;             // camera-space y-down → scene y-up
  scn.add(rigMesh);
  // left-screen projected twin — textured with the USER'S OWN LIVE PIXELS
  try {
    lfxRen = lfxRen || new THREE.WebGLRenderer({ canvas: document.getElementById('lmesh'), alpha: true, antialias: true });
    const vtex = new THREE.VideoTexture(vid);
    vtex.colorSpace = THREE.SRGBColorSpace;
    const lgeo = mk();
    lgeo.setAttribute('aPrev', new THREE.BufferAttribute(new Float32Array(t.nv * 3), 3));
    maskTex = new THREE.CanvasTexture(maskCv);
    const lmat = new THREE.ShaderMaterial({ vertexShader: LFX_VERT, fragmentShader: LFX_FRAG,
      transparent: true, depthWrite: true, side: THREE.DoubleSide,
      uniforms: { uVid: { value: vtex }, uMask: { value: maskTex }, uMix: { value: 1 },
                  uShift: { value: new THREE.Vector2() },
                  uCamT: { value: new THREE.Vector3() }, uFocal: { value: 1000 }, uIw: { value: 960 },
                  uIh: { value: 540 }, uCover: { value: new THREE.Vector4() },
                  uCanvas: { value: new THREE.Vector2() }, uTime: { value: 0 }, uGrow: { value: 0 } } });
    lfxMesh = new THREE.Mesh(lgeo, lmat);
    lfxMesh.frustumCulled = false;
    lfxScn = new THREE.Scene(); lfxScn.add(lfxMesh);
    lfxCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);
  } catch (e) { console.error('left fx layer failed', e); }
  S.rig.topo = t;
  toast('🦴 body reconstructed — scales on YOU (left) + orbitable mesh (right)');
}
function rigPacket(p) {
  if (!rigMesh) return;
  const q = b64u16(p.q), n = p.nv;
  const pos = rigMesh.geometry.getAttribute('position');
  const lpos = lfxMesh && lfxMesh.geometry.getAttribute('position');
  const lprev = lfxMesh && lfxMesh.geometry.getAttribute('aPrev');
  if (lprev && lpos) { lprev.array.set(lpos.array); lprev.needsUpdate = true; }
  for (let a = 0; a < 3; a++) { const mn = p.vmin[a], rg = p.vmax[a] - mn;
    for (let i = 0; i < n; i++) {
      const v = mn + q[i * 3 + a] / 65535 * rg;
      pos.array[i * 3 + a] = v;
      if (lpos) lpos.array[i * 3 + a] = v;
    } }
  pos.needsUpdate = true;
  rigMesh.geometry.computeVertexNormals();
  if (lpos) { lpos.needsUpdate = true;
    const u = lfxMesh.material.uniforms;
    u.uCamT.value.set(p.cam_t[0], p.cam_t[1], p.cam_t[2]);
    u.uFocal.value = p.focal; u.uIw.value = p.iw; u.uIh.value = p.ih; }
  S.rig.tPrev = S.rig.lastPkt || performance.now();
  S.rig.lastPkt = performance.now(); S.rig.ms = p.ms;
  S.rig.id = p.id;
  S.rig.box = [p.box[0] / p.iw, p.box[1] / p.ih, p.box[2] / p.iw, p.box[3] / p.ih];
  // growth does NOT auto-start: default = neutral body rig; effects start it
}
function drawLfx(now) {
  const c = document.getElementById('lmesh');
  const live = lfxMesh && S.rigOn && now - S.rig.lastPkt < 2500;
  if (!lfxRen) return;
  if (!live) { c.style.opacity = '0'; return; }
  c.style.opacity = '1';
  const r = document.getElementById('scrL').getBoundingClientRect();
  if (r.width < 4) return;
  if (c.width !== Math.round(r.width * Math.min(devicePixelRatio, 2))) {
    lfxRen.setSize(r.width, r.height, false); lfxRen.setPixelRatio(Math.min(devicePixelRatio, 2));
  }
  const vw = vid.videoWidth || 960, vh = vid.videoHeight || 540;
  const sc = Math.max(r.width / vw, r.height / vh);
  const dw = vw * sc, dh2 = vh * sc;
  const u = lfxMesh.material.uniforms;
  u.uCover.value.set((r.width - dw) / 2, (r.height - dh2) / 2, dw, dh2);
  u.uCanvas.value.set(r.width, r.height);
  u.uTime.value = now * .001;
  u.uGrow.value = grow0 ? Math.min(1, (now - grow0) / 5000) : 0;
  const span = Math.max(120, S.rig.lastPkt - (S.rig.tPrev || S.rig.lastPkt));
  u.uMix.value = Math.min(1.2, (now - S.rig.lastPkt) / span);
  // E1a POSE-RATE SNAP: live pose bbox vs the bbox at rig-inference time —
  // the mesh follows the body at skeleton rate between 2.5Hz rig refreshes
  if (S.rig.box) {
    const p = S.players.find(q => q.id === S.rig.id);
    if (p) {
      const rcx = (S.rig.box[0] + S.rig.box[2]) / 2, rcy = (S.rig.box[1] + S.rig.box[3]) / 2;
      u.uShift.value.set((p.bbox.x + p.bbox.w / 2) - rcx, (p.bbox.y + p.bbox.h / 2) - rcy);
    }
  }
  // E1b FEATHERED MASK: rasterize the (warped) person masks at low res → the
  // shader clips the effect to the pixel-accurate silhouette with a soft edge
  maskCtx.clearRect(0, 0, 480, 270);
  let drew = false;
  for (const o of S.smasks) {
    if (o.role !== 'player') continue;
    let dx = 0, dy = 0;
    if (o.a) { const p = S.players.find(q => q.id === o.id);
      if (p) { dx = (p.bbox.x + p.bbox.w / 2) - o.a[0]; dy = (p.bbox.y + p.bbox.h / 2) - o.a[1]; } }
    maskCtx.filter = 'blur(3px)'; maskCtx.fillStyle = '#fff';
    for (const poly of o.polys) {
      maskCtx.beginPath();
      poly.forEach(([x, y], i) => { const X = (x + dx) * 480, Y = (y + dy) * 270; i ? maskCtx.lineTo(X, Y) : maskCtx.moveTo(X, Y); });
      maskCtx.closePath(); maskCtx.fill();
    }
    drew = true;
  }
  // STRICT: no person mask yet → mask stays BLACK → the effect is hidden
  // until segmentation locks on (was: full-white fallback = scales sprayed
  // across the background while SAM warmed up)
  if (maskTex) maskTex.needsUpdate = true;
  if (!drew && grow0) grow0 = performance.now();   // growth waits for the mask
  lfxRen.render(lfxScn, lfxCam);
}
function sizeDH() {
  const r = document.getElementById('scrR').getBoundingClientRect();
  if (r.width < 4) return;
  ren.setSize(r.width, r.height, false);
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
}
addEventListener('resize', sizeDH);

// ── LIVE overlay (left): masks + skeletons on the video ──────────────────
const EDGES = [[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
function cptColor(t) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},85%,62%)`; }
function drawLive() {
  const r = document.getElementById('scrL').getBoundingClientRect();
  if (lov.width !== Math.round(r.width)) { lov.width = r.width; lov.height = r.height; }
  lctx.clearRect(0, 0, lov.width, lov.height);
  if (performance.now() - S.lastPkt > 2000) return;
  // cover-projection of the raw video into the screen rect
  const vw = vid.videoWidth || 960, vh = vid.videoHeight || 540;
  const sc = Math.max(lov.width / vw, lov.height / vh);
  const dw = vw * sc, dh2 = vh * sc, ox = (lov.width - dw) / 2, oy = (lov.height - dh2) / 2;
  const P = (x, y) => [ox + x * dw, oy + y * dh2];
  for (const o of S.smasks) {
    const isP = o.role === 'player';
    // rig on → the textured mesh IS the person layer; skip the mask fill noise
    if (isP && S.rigOn && S.rig.lastPkt) continue;
    // cs-13 MOTION WARP: re-pin person masks to the live skeleton every frame
    let dx = 0, dy = 0;
    if (isP && o.a) {
      const p = S.players.find(q => q.id === o.id);
      if (p) { dx = (p.bbox.x + p.bbox.w / 2) - o.a[0]; dy = (p.bbox.y + p.bbox.h / 2) - o.a[1]; }
    }
    const col = isP ? '#5dff7d' : cptColor(o.role);
    lctx.strokeStyle = col; lctx.fillStyle = col + '26'; lctx.lineWidth = 2;
    for (const poly of o.polys) {
      lctx.beginPath();
      poly.forEach(([x, y], i) => { const [X, Y] = P(x + dx, y + dy); i ? lctx.lineTo(X, Y) : lctx.moveTo(X, Y); });
      lctx.closePath(); lctx.fill(); lctx.stroke();
    }
    if (o.role !== 'player' && o.polys[0]) {
      const big = o.polys.reduce((a, b) => b.length > a.length ? b : a);
      let cx = 0, cy = 0; for (const [x, y] of big) { cx += x; cy += y; }
      const [X, Y] = P(cx / big.length, cy / big.length);
      lctx.font = 'bold 14px ui-monospace'; lctx.fillStyle = col;
      lctx.save(); lctx.translate(X, Y); lctx.scale(-1, 1);   // canvas is CSS-mirrored
      lctx.fillText(o.role, -lctx.measureText(o.role).width / 2, 0); lctx.restore();
    }
  }
  for (const p of S.players) {
    lctx.strokeStyle = '#9fc0d8'; lctx.lineWidth = 2.5; lctx.lineCap = 'round';
    for (const [a, b] of EDGES) {
      const ka = p.body2D[a], kb = p.body2D[b];
      if (!ka || !kb || (ka.score ?? 0) < .3 || (kb.score ?? 0) < .3) continue;
      const [x1, y1] = P(ka.x, ka.y), [x2, y2] = P(kb.x, kb.y);
      lctx.beginPath(); lctx.moveTo(x1, y1); lctx.lineTo(x2, y2); lctx.stroke();
    }
  }
}

// ── cloud connection: frame pump + ingest (same wire as mpgames) ─────────
const cv = document.createElement('canvas'); const cctx = cv.getContext('2d');
function connect() {
  try { S.ws = new WebSocket(SRV); } catch { statEl.textContent = 'bad server url'; return; }
  S.ws.binaryType = 'arraybuffer';
  S.ws.onopen = () => {
    statEl.textContent = 'connected · ' + SRV.replace(/^wss?:\/\//, '').slice(0, 34);
    S.ws.send(JSON.stringify({ profile: 'general' }));
    if (S.sam) S.ws.send(JSON.stringify({ cmd: 'sam', on: 1 }));
    for (const c of S.concepts) S.ws.send(JSON.stringify({ cmd: 'concept', text: c, on: 1 }));
    if (S.rigOn) S.ws.send(JSON.stringify({ cmd: 'rig', on: 1 }));
  };
  S.ws.onclose = () => { S.inFlight = 0; statEl.textContent = 'reconnecting…'; setTimeout(connect, 2000); };
  S.ws.onmessage = (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    S.inFlight = Math.max(0, S.inFlight - 1);
    const t = performance.now();
    if (d.cts && t - d.cts > 0 && t - d.cts < 5000) { S.rtt = t - d.cts;
      S.rttEma = S.rttEma ? S.rttEma * .85 + S.rtt * .15 : S.rtt;
      S.baseRtt = Math.min(S.baseRtt * 1.0015, S.rtt); }
    S.lastPkt = t;
    S.players = d.players || [];
    S.smasks = d.smasks || [];
    if (d.court) S.court = d.court;
    S.msGpu = d.ms || 0; S.samMs = d.sms || 0;
    if (d.rig_topo && !S.rig.topo) rigTopo(d.rig_topo);
    if (d.rig) rigPacket(d.rig);
    if (d.rigst === 'loading' && !S._lt) { S._lt = 1; toast('🦴 cloud is loading the 3D body model (~1 min)…', 8000); }
  };
}
function pump(now) {
  if (!S.ws || S.ws.readyState !== 1 || !vid.videoWidth) return;
  const over = S.rttEma - S.baseRtt;
  S.sendIv = Math.min(280, Math.max(66, S.sendIv * (over > 140 ? 1.2 : over < 70 ? .94 : 1)));
  if (now - S.lastSend >= 1500) S.inFlight = 0;
  if (S.inFlight >= 2 || S.ws.bufferedAmount > 131072 || now - S.lastSend < S.sendIv) return;
  S.inFlight++; S.lastSend = now;
  const w = 960, h = Math.round(w * vid.videoHeight / vid.videoWidth) || 540;
  cv.width = w; cv.height = h; cctx.drawImage(vid, 0, 0, w, h);
  const capT = now;
  cv.toBlob(b => {
    if (!b || !S.ws || S.ws.readyState !== 1) { S.inFlight = Math.max(0, S.inFlight - 1); return; }
    b.arrayBuffer().then(buf => {
      const out = new ArrayBuffer(8 + buf.byteLength);
      new DataView(out).setFloat64(0, capT, true);
      new Uint8Array(out, 8).set(new Uint8Array(buf));
      S.ws.send(out);
    });
  }, 'image/jpeg', 0.62);
}

// ── the PROMPT — primary input, routes intent to the lanes ───────────────
function applyPrompt(raw) {
  const p = raw.trim().toLowerCase();
  if (!p) return;
  const say = (m) => toast(m, 4000);
  if (/^(clear|reset|stop|off|✕ clear all)/.test(p) || p.includes('clear all')) {
    for (const c of S.concepts) S.ws?.send(JSON.stringify({ cmd: 'concept', text: c, on: 0 }));
    S.concepts.clear(); S.sam = false;
    S.ws?.send(JSON.stringify({ cmd: 'sam', on: 0 }));
    grow0 = 0;                       // effects off — the body rig itself STAYS (default state)
    say('✕ effects & concepts cleared — body rig keeps tracking (that is the default)'); return;
  }
  if (/(scale|slime|skin|dragon|feather|armor|fire)/.test(p)) {
    S.rigOn = true; S.sam = true;    // sam masks feed the E1 silhouette clip
    S.ws?.send(JSON.stringify({ cmd: 'rig', on: 1 }));
    S.ws?.send(JSON.stringify({ cmd: 'sam', on: 1 }));
    grow0 = performance.now();       // start the growth front NOW
    say('🐉 growing the effect over your body — left = on your skin, right = on the rig'); return;
  }
  if (/(segment|people|everyone|mask)/.test(p)) {
    S.sam = true; S.ws?.send(JSON.stringify({ cmd: 'sam', on: 1 }));
    say('🎭 segmenting everyone — masks appear as SAM3 finds them'); return;
  }
  // anything else = a CONCEPT to find & track ("track the floor" → floor)
  const text = p.replace(/^(track|find|add|show|segment)\s+(the\s+)?/, '').trim();
  if (!text) return;
  S.concepts.add(text); S.sam = true;
  S.ws?.send(JSON.stringify({ cmd: 'sam', on: 1 }));
  S.ws?.send(JSON.stringify({ cmd: 'concept', text, on: 1 }));
  say(`🧿 tracking "${text}" — mask + label appear as SAM3 locks on`);
}
document.getElementById('pgo').addEventListener('click', () => {
  const i = document.getElementById('pin'); applyPrompt(i.value); i.value = '';
});
document.getElementById('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('pgo').click(); });
document.getElementById('chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (c) applyPrompt(c.textContent.replace(/^[^\s]+\s/, ''));
});

// ── boot ─────────────────────────────────────────────────────────────────
async function boot(kind) {
  document.getElementById('boot').style.display = 'none';
  if (kind === 'cam') {
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      vid.srcObject = st;
    } catch (e) { toast('camera blocked: ' + e.message, 6000); return; }
  } else {
    document.body.classList.add('nomirror');       // footage shows unmirrored
    vid.crossOrigin = 'anonymous'; vid.src = SAMPLE_URL; vid.loop = true;
  }
  await vid.play().catch(() => {});
  connect();
}
document.getElementById('bootCam').addEventListener('click', () => boot('cam'));
document.getElementById('bootSample').addEventListener('click', () => boot('sample'));

// ── main loop ────────────────────────────────────────────────────────────
function loop(now) {
  requestAnimationFrame(loop);
  pump(now);
  drawLive();
  drawLfx(now);
  orbit.update();
  if (rigMesh) {
    rigMesh.material.uniforms.uTime.value = now * .001;
    rigMesh.material.uniforms.uGrow.value = grow0 ? Math.min(1, (now - grow0) / 5000) : 0;
  }
  sizeDH.once || (sizeDH(), sizeDH.once = 1);
  ren.render(scn, cam);
  statEl.textContent = (S.ws?.readyState === 1 ? '●' : '○') +
    ` ${BUILD} · rtt ${S.rtt.toFixed(0)}ms · gpu ${S.msGpu.toFixed(0)}ms` +
    (S.samMs ? ` · sam ${S.samMs.toFixed(0)}ms` : '') +
    (S.rig.lastPkt ? ` · rig ${S.rig.ms.toFixed(0)}ms` : '') +
    ` · ${S.players.length}p`;
}
requestAnimationFrame(loop);
</script>
