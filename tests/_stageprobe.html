<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>stage probe — design S surface, remote tiles, hand sources (no landmarkers)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #0b0e13; color: #dfe3ea; font: 12px/1.4 system-ui, sans-serif; }
  #stage { position: relative; width: 994px; height: 678px; background: #161a22; overflow: hidden; }
  .tile { position: absolute; background: #262c38; border-radius: 8px; box-sizing: border-box; border: 1px solid #38404f; }
  .tile__label { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #aab2c0; }
  #surface { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 6; }
  #meta { padding: 6px 10px; color: #8c96a8; }
</style>
<!-- the repo's own three 0.160.0 (node_modules, served by tools/dev-server.mjs) so the probe never depends on the CDN -->
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="meta">booting</div>
<script type="module">
import * as THREE from 'three';
import { StageRenderer } from '/sdk/game/stage-renderer.js';
import { RemoteTile } from '/sdk/game/remote-tile.js';
import { ClipSource, KeyboardSource, makeHandSource } from '/sdk/game/hand-sources.js';
import { D, U, stagePxFromWorld, worldFromStagePx, courtToStagePx, courtToWorld, courtRadiusWorld, tileWorldRect, worldToCourt } from '/sdk/game/court-space.js';
import { CourtMap, buildSeatMap, EDGE, SEAT_NONE } from '/sdk/game/court-map.js';
import { PackGen, packToHands } from '/sdk/game/pack-gen.js';
import { encodeHandStream, decodeHandStream } from '/sdk/net/hand-stream.js';
import { RemoteHands } from '/sdk/net/remote-consumer.js';
import { handAgeAlpha } from '/sdk/game/latency-cues.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? +Q.get(k) : d);
const N = Math.max(1, Math.min(12, num('tiles', 9)));
const W = num('w', 994), H = num('h', 678);
const GAP = 8, PAD = 8;

// gallery rule B — research/ui/scripts/gallery-grid.mjs:30-41 verbatim
function fixed169(n, W, H, gap = 8, tol = 0.10) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const tw = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * (16 / 9));
    const c = { cols, rows, tw: Math.floor(tw), th: Math.floor(tw * 9 / 16) };
    if (!best || c.tw > best.tw * (1 + tol)) best = c;
    else if (c.tw >= best.tw * (1 - tol) && c.cols > best.cols) best = c;
  }
  const usedW = best.cols * best.tw + gap * (best.cols - 1), usedH = best.rows * best.th + gap * (best.rows - 1);
  return { ...best, padX: Math.floor((W - usedW) / 2), padY: Math.floor((H - usedH) / 2) };
}

const stageEl = document.getElementById('stage');
stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
const grid = fixed169(N, W - 2 * PAD, H - 2 * PAD, GAP);
const { cols, rows, tw, th } = grid;
const rects = [];
for (let i = 0; i < N; i++) {
  const r = Math.floor(i / cols), c = i % cols;
  const m = (r === rows - 1) ? N - r * cols : cols;
  const rowW = m * tw + (m - 1) * GAP, fullW = cols * tw + (cols - 1) * GAP;
  const left = PAD + grid.padX + (fullW - rowW) / 2 + c * (tw + GAP);
  const top = PAD + grid.padY + r * (th + GAP);
  rects.push({ left, top, width: tw, height: th });
  const el = document.createElement('article'); el.className = 'tile'; el.setAttribute('role', 'group'); el.setAttribute('aria-label', 'Tile ' + (i + 1));
  el.style.cssText = `left:${left}px;top:${top}px;width:${tw}px;height:${th}px`;
  const label = document.createElement('div'); label.className = 'tile__label'; label.textContent = 'Remote ' + (i + 1);
  el.append(label); stageEl.append(el);
}
const surface = document.createElement('canvas'); surface.id = 'surface'; stageEl.append(surface);

// ── the stage: one surface, one camera per tile ─────────────────────────────
const stage = new StageRenderer(surface, { gap: GAP, maxDpr: 1 });
stage.resize(W, H, th, tw);
const tiles = rects.map((r, i) => stage.tileCamera(i, r));
let lostCbCalls = 0;
stage.onContextLost(() => { lostCbCalls++; });

// ── court (aspect = tw/th so court rects and DOM rects coincide) ────────────
const roster = rects.map((_, i) => ({ clientId: 't' + i, name: 'P' + i, tracked: true, aspect: tw / th, handSpan: 0.2 }));
const court = new CourtMap(buildSeatMap(roster, { cols, wrap: 'row', kickoff: 0 }));

// ── the ball: ONE matcap mesh on layer 0 ────────────────────────────────────
const ball = stage.ballMesh(courtRadiusWorld(court));
stage.scene.add(ball);
{ const r0 = court.rectOf(0); const p = courtToWorld(court, r0.x0 + r0.w / 2, r0.y0 + 0.5, rects, W, H, th); ball.position.set(p.x, p.y, -D); }

// ── remote tiles: every tile is a receiver (no landmarkers on this page) ────
const remotes = tiles.map((t, i) => {
  const rt = new RemoteTile('t' + i, { scene: stage.scene, camera: t.cam, style: 'smooth', occluder: true });
  stage.assignLayer(rt.rigR, t.layer); stage.assignLayer(rt.rigL, t.layer);
  rt.setCover(tw, th);
  return rt;
});
const remoteHands = new RemoteHands({ alpha: handAgeAlpha, predMs: 0, localNow: () => performance.now() });
const clock = { t0: performance.now(), now() { return (performance.now() - this.t0) >>> 0; } };
let seq = 0;

// ── the keyboard hand (ovPacks seam) ────────────────────────────────────────
const S = { ovPacks: {} };
const kb = new KeyboardSource({ S, clientId: 'me', tileWorldRect: () => tileWorldRect(court, 0, rects, W, H, th), speedMps: 0.6 });
kb.bind(window);

// ── frame loop ──────────────────────────────────────────────────────────────
let last = performance.now(), frames = 0, renderErrors = 0;
const lastFeed = new Array(N).fill(null);
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(1 / 240, (now - last) / 1000)); last = now;
  const sNow = clock.now();
  for (let i = 0; i < N; i++) {
    const rd = remoteHands.read(i, sNow);
    remotes[i].setSlotsToDrop(remoteHands.slotsToDrop(i, sNow));
    remotes[i].feed(rd, now, dt, null);
    remotes[i].setAlpha(rd.alpha);
    lastFeed[i] = rd;
  }
  kb.tick(dt);
  try { stage.render(tiles); } catch (e) { renderErrors++; }
  frames++;
  if ((frames & 31) === 0) document.getElementById('meta').textContent = `${N} tiles ${cols}x${rows} ${tw}x${th} · frames ${frames} · calls ${stage.info().calls} · contexts ${stage.contexts()} · rebuilds ${stage.rebuilds}`;
}
requestAnimationFrame(frame);

// ── probe helpers ───────────────────────────────────────────────────────────
const sleepFrames = n => new Promise(r => { let k = 0; const f = () => (++k >= n ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });

/**
 * Read a 1-px column (axis 'y') or row (axis 'x') of the surface RIGHT AFTER a synchronous render, within ±win CSS px of
 * (px, py) along the scan axis (so a posed rig elsewhere on the same row never joins the ball's span); returns the extent
 * of painted pixels (alpha >= alphaMin) in CSS px.
 */
function scanLine(px, py, axis = 'y', alphaMin = 96, win = 40) {
  stage.render(tiles);
  const r = stage.renderer, gl = r.getContext(), dpr = r.getPixelRatio();
  const cw = r.domElement.width, ch = r.domElement.height;
  let buf, lo = -1, hi = -1;
  if (axis === 'y') {
    const x = Math.round(px * dpr); buf = new Uint8Array(ch * 4);
    gl.readPixels(x, 0, 1, ch, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const cy = Math.round((ch - 1) - py * dpr), j0 = Math.max(0, cy - win * dpr), j1 = Math.min(ch - 1, cy + win * dpr);
    for (let j = j0; j <= j1; j++) { if (buf[j * 4 + 3] >= alphaMin) { if (lo < 0) lo = j; hi = j; } }
    // GL rows run bottom-up: convert to CSS y
    if (lo >= 0) { const a = (ch - 1 - hi) / dpr, b = (ch - 1 - lo) / dpr; return { lo: a, hi: b, span: b - a + 1 / dpr }; }
  } else {
    const y = Math.round((ch - 1) - py * dpr); buf = new Uint8Array(cw * 4);
    gl.readPixels(0, y, cw, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const cx = Math.round(px * dpr), j0 = Math.max(0, cx - win * dpr), j1 = Math.min(cw - 1, cx + win * dpr);
    for (let j = j0; j <= j1; j++) { if (buf[j * 4 + 3] >= alphaMin) { if (lo < 0) lo = j; hi = j; } }
    if (lo >= 0) return { lo: lo / dpr, hi: hi / dpr, span: (hi - lo) / dpr + 1 / dpr };
  }
  return { lo: -1, hi: -1, span: 0 };
}

/** Place the ball at a court point (world on the hand plane) and return its stage px centre. */
function placeBallCourt(x, y) {
  const p = courtToWorld(court, x, y, rects, W, H, th);
  ball.position.set(p.x, p.y, -D);
  return stagePxFromWorld(ball.position, W, H, th);
}

/** Every gutter (horizontal: L/R pairs; vertical: T pairs) with its court mid-point. */
function gutters() {
  const out = [], g = court.map.gutter;
  for (const r of court.rects) {
    const nbR = court.neighbourAt(r.seat, EDGE.R, r.y0 + 0.5);
    if (nbR.seat >= 0 && nbR.wrapDx === 0) out.push({ kind: 'h', a: r.seat, b: nbR.seat, x: r.x0 + r.w + g / 2, y: r.y0 + 0.5 });
    const nbT = court.neighbourAt(r.seat, EDGE.T, r.x0 + r.w / 2);
    if (nbT.seat >= 0) out.push({ kind: 'v', a: r.seat, b: nbT.seat, x: r.x0 + r.w / 2, y: r.y0 + r.h + g / 2 });
  }
  return out;
}

/** The [M2] measurement: ball at every gutter mid-point, 1-px scan 2 px into each half, chord half-lengths vs R·th. */
function measureGutters() {
  const Rpx = court.R * th, dx = 2, expect = Math.sqrt(Rpx * Rpx - dx * dx);
  const res = [];
  for (const gt of gutters()) {
    const c = placeBallCourt(gt.x, gt.y);
    let a, b;
    if (gt.kind === 'h') { a = scanLine(c.px - dx, c.py, 'y'); b = scanLine(c.px + dx, c.py, 'y'); }
    else { a = scanLine(c.px, c.py + dx, 'x'); b = scanLine(c.px, c.py - dx, 'x'); }
    res.push({ ...gt, px: +c.px.toFixed(2), py: +c.py.toFixed(2), halfA: a.span / 2, halfB: b.span / 2, expect, diff: Math.abs(a.span - b.span) / 2, errA: Math.abs(a.span / 2 - expect), errB: Math.abs(b.span / 2 - expect) });
  }
  // restore the ball to seat 0
  { const r0 = court.rectOf(0); placeBallCourt(r0.x0 + r0.w / 2, r0.y0 + 0.5); }
  return { Rpx, expect, gutters: res };
}

/** Layer check: every rig object of tile i on layer 1+i (mesh AND occluder). */
function layerReport() {
  return remotes.map((rt, i) => {
    const want = 1 << (1 + i);
    const objs = [];
    for (const rig of [rt.rigR, rt.rigL]) rig.grp.traverse(o => objs.push({ isMesh: !!o.isMesh, mask: o.layers.mask, isOccluder: o === rig.occluder, isMain: o === rig.mesh }));
    const meshes = objs.filter(o => o.isMesh);
    return { i, want, meshes: meshes.length, okAll: meshes.every(o => o.mask === want), hasOccluder: meshes.some(o => o.isOccluder), hasMain: meshes.some(o => o.isMain), cameraSees: !!(tiles[i].cam.layers.mask & want), otherCamSees: tiles.some((t, j) => j !== i && (t.cam.layers.mask & want)) };
  });
}

/** Send a HAND_STREAM with a cup pack at tile i's centre for seat i through the real wire (packToHands → encode → RemoteHands). */
function sendCup(i, slot = 'right', dy = -0.05) {
  const t = tiles[i], r = court.rectOf(i);
  const p = courtToWorld(court, r.x0 + r.w / 2 + 0.15, r.y0 + 0.5 + dy, rects, W, H, th);
  const pack = PackGen.cup(p.x, p.y, -D);
  const hands = packToHands(pack, t.uvCam, { slot });
  const buf = encodeHandStream(i, hands, seq++, clock.now());
  const dec = decodeHandStream(buf);
  const accepted = remoteHands.onMessage(buf);
  return { bytes: buf.byteLength, accepted, decodedSeat: dec.seat, pack, worldWrist: [p.x, p.y, -D] };
}
/** Send any world pack (21 {x,y,z}) for seat i through the same wire — e.g. a REST_R42 hand for a visual check. */
function sendPack(i, pack, slot = 'right') {
  const buf = encodeHandStream(i, packToHands(pack, tiles[i].uvCam, { slot }), seq++, clock.now());
  return remoteHands.onMessage(buf);
}
/** A realistic hand: the SDK rest pose (hands.js REST_R42, 21 points, ~0.5 m tall) scaled to `scale` m at tile i's centre. */
async function sendRest(i, scale = 0.35, slot = 'right') {
  const { REST_R42 } = await import('/sdk/core/hands.js');
  const r = court.rectOf(i), c = courtToWorld(court, r.x0 + r.w / 2, r.y0 + 0.5, rects, W, H, th);
  const k = scale / 0.45;
  const pack = REST_R42.slice(0, 21).map(q => ({ x: c.x + (q[0] + 0.3) * k, y: c.y + (q[1] - 0.2) * k, z: -D + q[2] * k }));
  return sendPack(i, pack, slot);
}
function sendNone(i) { const buf = encodeHandStream(i, { left: null, right: null }, seq++, clock.now()); return remoteHands.onMessage(buf); }

function remoteReport(i) {
  const rt = remotes[i], rd = lastFeed[i];
  const posed = rt.packs.R ? rt.rigR : rt.packs.L ? rt.rigL : null;
  const key = rt.packs.R ? 'R' : rt.packs.L ? 'L' : null;
  const wrist = posed && rt.packs[key] ? rt.packs[key][0] : null;
  return {
    i, handsLen: rt.packs.hands.length, key, slot: rt.packs.hands[0]?.slot ?? null,
    rigRMeshVisible: rt.rigR.mesh.visible, rigLMeshVisible: rt.rigL.mesh.visible,
    posedGrpVisible: posed ? posed.grp.visible : false, rigRGrpVisible: rt.rigR.grp.visible, rigLGrpVisible: rt.rigL.grp.visible,
    wrist: wrist ? [wrist.x, wrist.y, wrist.z] : null,
    ageMs: rd ? rd.ageMs : null, alpha: rt.alpha, present: rd ? rd.present : null,
    viewsDistinct: remotes.every((o, j) => j === i || o.views !== rt.views),
    handR: { present: rt.handR.present }, handL: { present: rt.handL.present },
    rigAlphaUniform: posed ? posed.uniforms.uAlpha.value : null,
  };
}

function loseContext() {
  const gl = stage.renderer.getContext();
  const ext = gl.getExtension('WEBGL_lose_context');
  if (!ext) return false;
  ext.loseContext();
  return true;
}

async function makeWebm() {
  const c = document.createElement('canvas'); c.width = 160; c.height = 90;
  const ctx = c.getContext('2d');
  const s = c.captureStream(30);
  const rec = new MediaRecorder(s, { mimeType: 'video/webm' });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  let t = 0;
  const iv = setInterval(() => { ctx.fillStyle = `hsl(${(t * 23) % 360} 60% 50%)`; ctx.fillRect(0, 0, 160, 90); ctx.fillStyle = '#fff'; ctx.fillRect((t * 7) % 150, 40, 10, 10); t++; }, 33);
  rec.start(100);
  await new Promise(r => setTimeout(r, 800));
  await new Promise(r => { rec.onstop = r; rec.stop(); });
  clearInterval(iv);
  for (const tr of s.getTracks()) tr.stop();
  if (!chunks.length) throw new Error('MediaRecorder produced no data');
  return URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
}
let clip = null;
async function startClip(prefer = 'webm') {
  let url, kind = prefer;
  if (prefer === 'webm') { try { url = await makeWebm(); } catch (e) { kind = 'mp4'; } }
  if (kind === 'mp4') url = '/tests/fixtures/clips/9161842981344352-YES.mp4';
  clip = makeHandSource('clip', { url });
  const t0 = performance.now();
  await clip.start();
  for (let k = 0; k < 150 && clip.video.readyState < 2; k++) await new Promise(r => setTimeout(r, 40));
  return { kind, readyState: clip.video.readyState, isClip: clip instanceof ClipSource, kindField: clip.kind, hasStream: !!clip.stream && clip.stream.getVideoTracks().length === 1, srcReady: clip.cam.src.readyState, ms: Math.round(performance.now() - t0), w: clip.video.videoWidth, h: clip.video.videoHeight };
}

function kbReport() {
  const ov = S.ovPacks.me || null;
  const { x, y, z } = kb.state;
  const same = (a, b) => !!a && !!b && a.length === 21 && a.every((p, i) => p.x === b[i].x && p.y === b[i].y && p.z === b[i].z);
  return {
    active: kb.state.active, closed: kb.state.closed, shape: kb.shape, x, y, z,
    hasOv: !!ov, L: ov ? ov.L : undefined, hasR: !!(ov && ov.R), len: ov && ov.R ? ov.R.length : 0,
    isFlat: ov ? same(ov.R, PackGen.flat(x, y, z)) : false,
    isCup: ov ? same(ov.R, PackGen.cup(x, y, z)) : false,
    isOpen: ov ? same(ov.R, PackGen.open(x, y, z)) : false,
    rect: tileWorldRect(court, 0, rects, W, H, th),
  };
}

window.__twin = {
  ready: true, S, stage, tiles, rects, court, ball, remotes, remoteHands, kb, clock,
  W, H, th, tw, cols, rows, N,
  get frames() { return frames; }, get renderErrors() { return renderErrors; }, get lostCbCalls() { return lostCbCalls; },
  measureGutters, layerReport, sendCup, sendPack, sendRest, sendNone, remoteReport, loseContext, startClip, kbReport, scanLine, placeBallCourt, sleepFrames,
  courtInfo: () => ({ R: court.R, Rpx: court.R * th, gutter: court.map.gutter, rects: court.rects.map(r => [r.seat, +r.x0.toFixed(4), +r.y0.toFixed(4), +r.w.toFixed(4)]) }),
  surfaceInDom: () => document.getElementById('surface') === stage.canvas && stage.canvas.parentNode === stageEl,
  helpers: { stagePxFromWorld, worldFromStagePx, courtToStagePx, courtToWorld, worldToCourt, tileWorldRect, U, D },
};
</script>
</body>
</html>
